name: Build slim packages

concurrency:
  group: slim-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        required: false

permissions:
  contents: read

jobs:
  plugins-linux-amd64:
    runs-on: ${{ github.repository_owner == 'emqx' && 'aws-ubuntu22.04-amd64' || 'ubuntu-22.04' }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.inputs.ref }}
        fetch-depth: 0
    - name: Set up environment
      id: env
      run: |
        source env.sh
        echo "BUILDER=$EMQX_DOCKER_BUILD_FROM" >> "$GITHUB_OUTPUT"
    - name: build plugins in builder
      env:
        BUILDER: ${{ steps.env.outputs.BUILDER }}
      run: |
        docker run --rm \
          -v "$PWD:/emqx" \
          -w /emqx \
          "$BUILDER" \
          bash -lc "git config --global --add safe.directory /emqx && make emqx-enterprise-compile && make plugins"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: "plugins"
        path: |
          _build/plugins/*.tar.gz
          _build/plugins/*.sha256
        retention-days: 7
        compression-level: 0

  linux:
    runs-on: ${{ github.repository_owner == 'emqx' && format('aws-ubuntu22.04-{0}', matrix.arch) || (matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04') }}
    env:
      PROFILE: ${{ matrix.profile }}
      ARCH: ${{ matrix.arch }}
      BUILDER_SYSTEM: force_docker

    strategy:
      fail-fast: false
      matrix:
        profile:
          - "emqx-enterprise"
        arch:
          - "arm64"
          - "amd64"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: build tgz
      run: |
        ./scripts/buildx.sh --profile $PROFILE --pkgtype tgz --arch $ARCH
    - name: build pkg
      run: |
        ./scripts/buildx.sh --profile $PROFILE --pkgtype pkg --arch $ARCH
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: "${{ matrix.profile }}-${{ matrix.arch }}"
        path: _packages/${{ matrix.profile }}/*
        retention-days: 7
        compression-level: 0

  mac:
    strategy:
      fail-fast: false
      matrix:
        profile:
        - emqx-enterprise
        os:
        - macos-26

    runs-on: ${{ matrix.os }}
    env:
      EMQX_NAME: ${{ matrix.profile }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up environment
      id: env
      run: |
        source env.sh
        echo "OTP_VSN=$OTP_VSN" >> "$GITHUB_OUTPUT"
        echo "ELIXIR_VSN=$ELIXIR_VSN" >> "$GITHUB_OUTPUT"
    # mix.lock is not checked in, so the key hashes the dependency declarations instead.
    # Bump the v1 prefix to invalidate every cached entry.
    - name: Compute dependency cache key
      id: deps-cache-key
      env:
        PREFIX: emqx-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ matrix.profile }}
        OTP_VSN: ${{ steps.env.outputs.OTP_VSN }}
        ELIXIR_VSN: ${{ steps.env.outputs.ELIXIR_VSN }}
        BUILD_INPUTS_HASH: ${{ hashFiles('env.sh', 'build', 'scripts/ensure-rebar3.sh', '.github/actions/package-macos/action.yaml') }}
        DEPS_HASH: ${{ hashFiles('mix.exs', 'apps/*/mix.exs') }}
      run: |
        sdk_vsn="$(xcrun --sdk macosx --show-sdk-version)"
        cc_hash="$(clang --version | head -1 | shasum -a 256 | cut -c1-16)"
        echo "key=${PREFIX}-otp${OTP_VSN}-elixir${ELIXIR_VSN}-sdk${sdk_vsn}-cc${cc_hash}-build${BUILD_INPUTS_HASH:0:16}-deps${DEPS_HASH:0:16}" >> "$GITHUB_OUTPUT"
    - name: Restore dependency cache
      id: deps-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          mix.lock
          _build/${{ matrix.profile }}/lib
        key: ${{ steps.deps-cache-key.outputs.key }}
    - uses: ./.github/actions/package-macos
      with:
        profile: ${{ matrix.profile }}
        otp: ${{ steps.env.outputs.OTP_VSN }}
        elixir: ${{ steps.env.outputs.ELIXIR_VSN }}
        os: ${{ matrix.os }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.os }}
        path: _packages/**/*
        retention-days: 7
    # The cache holds dependencies only. Umbrella apps are always compiled from source.
    - name: Remove umbrella apps from the dependency cache
      if: success() && steps.deps-cache.outputs.cache-hit != 'true'
      env:
        PROFILE: ${{ matrix.profile }}
      run: |
        for app in apps/*/; do
          rm -rf "_build/${PROFILE}/lib/$(basename "$app")"
        done
        du -sh deps "_build/${PROFILE}/lib"
    - name: Save dependency cache
      if: success() && steps.deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          mix.lock
          _build/${{ matrix.profile }}/lib
        key: ${{ steps.deps-cache-key.outputs.key }}
