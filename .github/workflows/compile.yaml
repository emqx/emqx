name: Compile

concurrency:
  group: compile-${{ inputs.warm-cache && 'warm-' || '' }}${{ inputs.build_type }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      builder:
        required: true
        type: string
      build_type:
        required: true
        type: string
      warm-cache:
        description: >-
          Only fill the dependency cache: on an exact hit stop after the lookup,
          on a miss compile and save the entry. Skip the checks and artifacts.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IS_CI: "yes"

defaults:
  run:
    shell: bash

jobs:
  compile:
    runs-on: ubuntu-22.04
    container: ${{ inputs.builder }}
    strategy:
      matrix:
        profile:
          - emqx-enterprise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Work around https://github.com/actions/checkout/issues/766
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore dependency cache
        id: deps-cache
        uses: ./.github/actions/deps-cache-restore
        with:
          profiles: ${{ inputs.build_type == 'test' && format('{0}-test', matrix.profile) || matrix.profile }}
          toolchain: ${{ inputs.builder }}
          build-inputs: .github/workflows/compile.yaml
          lookup-only: ${{ inputs.warm-cache }}
      - id: compile
        if: ${{ !inputs.warm-cache || steps.deps-cache.outputs.cache-hit != 'true' }}
        env:
          PROFILE: ${{ matrix.profile }}
          ENABLE_COVER_COMPILE: 1
          MAKE_TARGET: ${{ inputs.build_type == 'test' && 'test-compile' || format('{0}-compile', matrix.profile) }}
          ARTIFACT_NAME: ${{ format('{0}-{1}.zip', matrix.profile, inputs.build_type) }}
        run: |
          set -exuo pipefail
          make ensure-rebar3
          # Ensure generated dashboard i18n assets (for example desc.zh.hocon)
          # exist in test artifacts consumed by downstream CT jobs.
          if [ "${{ inputs.build_type }}" = "test" ]; then
            make pre-compile
          fi
          make ${MAKE_TARGET}
          echo "export PROFILE=${PROFILE}" | tee -a env.sh
          echo "export PKG_VSN=$(./pkg-vsn.sh ${PROFILE})" | tee -a env.sh
          # .zipignore drops build-time caches under deps/ that CT does not
          # read: git pack files, rebar3 plugin caches, prebuilt NIF tarballs
          # and cargo targets. It keeps deps/*/.git/HEAD and config, which mix
          # reads to check git deps against mix.lock.
          zip -ryq -x@.github/workflows/.zipignore $ARTIFACT_NAME .
      - name: Check API scope coverage
        if: ${{ !inputs.warm-cache && inputs.build_type == 'test' }}
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          ## On release-60 the build system is mix, and `make test-compile`
          ## targets PROFILE=${PROFILE}-test, so beam files land under
          ## _build/${PROFILE}-test/lib, not _build/${PROFILE}/lib.
          ./scripts/check-api-scope-coverage.escript _build/${PROFILE}-test/lib
      - name: Check for unlisted CT cases
        if: ${{ !inputs.warm-cache && inputs.build_type == 'test' }}
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          ## Same lib dir as the scope check above: the suite beams only
          ## exist in the test profile.
          ./scripts/check-unlisted-ct-cases.escript _build/${PROFILE}-test/lib
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.warm-cache }}
        with:
          name: ${{ matrix.profile }}-${{ inputs.build_type }}
          path: ${{ matrix.profile }}-${{ inputs.build_type }}.zip
          retention-days: 7
          if-no-files-found: error
      - name: build release with schema dump
        if: ${{ !inputs.warm-cache && inputs.build_type == 'release' }}
        env:
          PROFILE: ${{ matrix.profile }}
        run: make ${PROFILE}-rel
      # The release directory is not part of the workspace artifact above (it is
      # built after it is zipped), so ship it separately for the jobs that need
      # to actually run a release, such as pytest_boot_tests.
      - name: package release dir
        if: ${{ !inputs.warm-cache && inputs.build_type == 'release' }}
        run: zip -ryq ${{ matrix.profile }}-rel.zip _build/${{ matrix.profile }}/rel/emqx
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.warm-cache && inputs.build_type == 'release' }}
        with:
          name: ${{ matrix.profile }}-rel
          path: ${{ matrix.profile }}-rel.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.warm-cache && inputs.build_type == 'release' }}
        with:
          name: "${{ matrix.profile }}-schema-dump"
          path: |
            env.sh
            scripts/spellcheck
            _build/docgen/${{ matrix.profile }}/*.json
            _build/docgen/${{ matrix.profile }}/*.hocon
          retention-days: 7
          if-no-files-found: error
      - name: Save dependency cache
        if: ${{ success() && inputs.warm-cache && steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/deps-cache-save
        with:
          key: ${{ steps.deps-cache.outputs.key }}
          paths: ${{ steps.deps-cache.outputs.paths }}
