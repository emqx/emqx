name: Upload release assets
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      publish_release_artifacts:
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify-release-tag:
    uses: ./.github/workflows/verify_release_tag.yaml
    with:
      ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
      require_ga: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || inputs.publish_release_artifacts }}

  upload:
    needs: verify-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      packages: write
      actions: read
      issues: read
      pull-requests: read
      repository-projects: read
      statuses: read
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-tag.outputs.ref }}
      - name: Fetch the release tag object
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERIFIED_TAG_OBJECT: ${{ needs.verify-release-tag.outputs.tag_object }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if [ -n "$VERIFIED_TAG_OBJECT" ]; then
            test "$(git rev-parse "refs/tags/$TAG")" = "$VERIFIED_TAG_OBJECT"
          fi
      - name: Detect profile
        id: profile
        run: |
          echo "profile=emqx-enterprise" >> $GITHUB_OUTPUT
          echo "version=$(./pkg-vsn.sh emqx-enterprise)" >> $GITHUB_OUTPUT
          echo "ref_name=$(./pkg-vsn.sh emqx-enterprise)" >> "$GITHUB_ENV"
          echo "s3dir=emqx-ee" >> $GITHUB_OUTPUT
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Get packages
        run: |
          BUCKET=${{ secrets.AWS_S3_BUCKET }}
          OUTPUT_DIR=${{ steps.profile.outputs.s3dir }}
          aws s3 cp --recursive s3://$BUCKET/$OUTPUT_DIR/${{ env.ref_name }} packages
          aws s3 cp --recursive s3://$BUCKET/emqx-plugins/${{ env.ref_name }} packages/plugins
      - name: Decide whether to publish
        id: gate
        if: (github.event_name == 'release' && !github.event.release.prerelease) || inputs.publish_release_artifacts
        run: echo "publish=true" >> "$GITHUB_OUTPUT"
      # The manifest tool runs from the workflow's own commit. For a release event
      # that is the tagged commit. For workflow_dispatch it lets a dry run inspect
      # a tag that predates the tool.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _manifest_tool
          sparse-checkout: scripts/rel/package_manifests.py
          sparse-checkout-cone-mode: false
      - name: Generate GitHub App token for emqx-package-manifests
        id: app-token
        if: steps.gate.outputs.publish == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTH_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: emqx-package-manifests
      # Runs before the pushes below, so that a failure there cannot leave a
      # published release without its records. A failure here does not stop the
      # pushes; the last step fails the job instead.
      - name: Record package manifests
        id: manifests
        if: steps.gate.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERSION: ${{ steps.profile.outputs.version }}
          VERIFIED_TAG_OBJECT: ${{ needs.verify-release-tag.outputs.tag_object }}
        run: |
          python3 _manifest_tool/scripts/rel/package_manifests.py \
            --packages-dir packages --version "$VERSION" --tag "$TAG" --publish \
            --verified-tag-object "$VERIFIED_TAG_OBJECT" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Dry-run package manifests
        if: steps.gate.outputs.publish != 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.profile.outputs.version }}
          VERIFIED_TAG_OBJECT: ${{ needs.verify-release-tag.outputs.tag_object }}
        run: |
          python3 _manifest_tool/scripts/rel/package_manifests.py \
            --packages-dir packages --version "$VERSION" --tag "$TAG" \
            --verified-tag-object "$VERIFIED_TAG_OBJECT"
      - name: update to emqx.io
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -eux
          curl -w %{http_code} \
               --insecure \
               -H "Content-Type: application/json" \
               -H "token: ${{ secrets.EMQX_IO_TOKEN }}" \
               -X POST \
               -d "{\"repo\":\"emqx/emqx\", \"tag\": \"${{ env.ref_name }}\" }" \
               ${{ secrets.EMQX_IO_RELEASE_API }}
      - name: Push to packagecloud.io
        if: steps.gate.outputs.publish == 'true'
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
          VERSION: ${{ steps.profile.outputs.version }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: |
          set -eu
          REPO='emqx-enterprise5'
          function push() {
            docker run -t --rm -e PACKAGECLOUD_TOKEN=$PACKAGECLOUD_TOKEN -v $(pwd)/$2:/w/$2 -w /w ghcr.io/emqx/package_cloud push emqx/$REPO/$1 $2
          }
          push "debian/bullseye" "packages/$PROFILE-$VERSION-debian11-amd64.deb"
          push "debian/bullseye" "packages/$PROFILE-$VERSION-debian11-arm64.deb"
          push "debian/bookworm" "packages/$PROFILE-$VERSION-debian12-amd64.deb"
          push "debian/bookworm" "packages/$PROFILE-$VERSION-debian12-arm64.deb"
          push "debian/trixie" "packages/$PROFILE-$VERSION-debian13-amd64.deb"
          push "debian/trixie" "packages/$PROFILE-$VERSION-debian13-arm64.deb"
          push "ubuntu/jammy" "packages/$PROFILE-$VERSION-ubuntu22.04-amd64.deb"
          push "ubuntu/jammy" "packages/$PROFILE-$VERSION-ubuntu22.04-arm64.deb"
          push "ubuntu/noble" "packages/$PROFILE-$VERSION-ubuntu24.04-amd64.deb"
          push "ubuntu/noble" "packages/$PROFILE-$VERSION-ubuntu24.04-arm64.deb"
          push "el/8" "packages/$PROFILE-$VERSION-el8-amd64.rpm"
          push "el/8" "packages/$PROFILE-$VERSION-el8-arm64.rpm"
          push "el/9" "packages/$PROFILE-$VERSION-el9-amd64.rpm"
          push "el/9" "packages/$PROFILE-$VERSION-el9-arm64.rpm"
          push "amazon/2023" "packages/$PROFILE-$VERSION-amzn2023-amd64.rpm"
          push "amazon/2023" "packages/$PROFILE-$VERSION-amzn2023-arm64.rpm"

      - name: Fail the job when package manifests were not recorded
        if: ${{ !cancelled() && steps.manifests.outcome == 'failure' }}
        run: |
          echo "::error::Package manifests were not recorded. See the 'Record package manifests' step."
          exit 1
