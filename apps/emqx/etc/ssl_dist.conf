%% This additional config file is used when the config 'cluster.proto_dist' in emqx.conf is set to 'inet_tls'.
%% Which means the EMQX nodes will connect to each other over TLS.
%% For more information about inter-broker security, see: https://docs.emqx.com/en/enterprise/v5.3/deploy/cluster/security.html

%% For more information in technical details see: http://erlang.org/doc/apps/ssl/ssl_distribution.html
%%
%% EMQX ships no certificates. Place your own at the paths below, or change the paths.

%% Both the 'server' and the 'client' side verify the peer certificate against 'cacertfile',
%% and the server requires the peer (client) to present a certificate.
%% Every cluster node must therefore present a certificate issued by a CA listed in 'cacertfile'.
[{server,
  [
  %{log_level, debug}, %% NOTE: debug level logging impacts performance, and need to set EMQX logging level to 'debug'
   {certfile, "{{ platform_etc_dir }}/certs/cert.pem"},
   {keyfile, "{{ platform_etc_dir }}/certs/key.pem"},
   {cacertfile, "{{ platform_etc_dir }}/certs/cacert.pem"},
   {verify, verify_peer},
   %% Implied by {verify, verify_peer} on the server side (OTP ssl_config.erl:708),
   %% spelled out here to make the requirement explicit.
   {fail_if_no_peer_cert, true}
  ]},
 {client,
  [
   %% The certificate this node presents when connecting to a peer. It must carry
   %% the clientAuth extended key usage: do not reuse 'cert.pem' here, that is a
   %% server (serverAuth) certificate and the peer will reject it.
   {certfile, "{{ platform_etc_dir }}/certs/client-cert.pem"},
   {keyfile, "{{ platform_etc_dir }}/certs/client-key.pem"},
   {cacertfile, "{{ platform_etc_dir }}/certs/cacert.pem"},
   {verify, verify_peer},
   %% By default OTP passes the peer node's host part as both the SNI value and the
   %% ReferenceID of the host name check that {verify, verify_peer} enables
   %% (see ssl_handshake.erl:3768 and ssl_certificate.erl:235 in OTP 28).
   %% Distribution node names are commonly IP addresses or names that the node
   %% certificate does not carry, so the host name check is disabled here; the
   %% certificate chain is still verified. Delete this line when every node
   %% certificate carries a dNSName/iPAddress SAN matching the node's host part,
   %% to also bind the certificate to the node name.
   {server_name_indication, disable}
  ]}].
