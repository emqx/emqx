services:
  ## If you need to debug the iceberg integration, uncomment this service and open
  ## `localhost:8888` to access some notebooks that help inspect stuff.  In particular,
  ## `emqx-iceberg-debug.ipynb` may be helpful to inspect data.
  # spark-iceberg:
  #   image: ghcr.io/emqx/spark:1.0.3
  #   container_name: spark-iceberg
  #   # build: spark/
  #   networks:
  #     emqx_bridge:
  #   depends_on:
  #     - iceberg-rest
  #     - seaweedfs
  #   volumes:
  #     - ./spark/notebooks/emqx-iceberg-debug.ipynb:/home/iceberg/notebooks/emqx-iceberg-debug.ipynb
  #   environment:
  #     - AWS_ACCESS_KEY_ID=admin
  #     - AWS_SECRET_ACCESS_KEY=password
  #     - AWS_REGION=us-east-1
  #   ports:
  #     - 8888:8888
  #     - 8080:8080
  #     - 10000:10000
  #     - 10001:10001
  ## Remember to uncomment `seaweedfs`'s port as well to inspect files, and `query`'s
  ## 7890 for nREPL access

  query:
    image: ghcr.io/emqx/spark-query:1.0.7
    container_name: query
    networks:
      emqx_bridge:
    expose:
      - 8090
      - 7890
    # ports:
    #   - 7890:7890
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=sa-east-1

  rewrite-proxy:
    image: public.ecr.aws/nginx/nginx:1.27-bookworm
    container_name: iceberg-rest-proxy
    depends_on:
      iceberg-rest:
        condition: service_healthy
    networks:
      emqx_bridge:
    volumes:
      - ./iceberg/nginx-rewrite-proxy.conf:/etc/nginx/conf.d/default.conf

  iceberg-rest:
    # image: apache/iceberg-rest-fixture:1.9.0
    image: ghcr.io/emqx/iceberg-rest-fixture:1.9.0.0
    container_name: iceberg-rest
    networks:
      emqx_bridge:
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 5s
      retries: 5
    # ports:
    #   - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=sa-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://seaweedfs.net:9000

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG}
    container_name: seaweedfs
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - S3_BUCKET=warehouse
    tmpfs:
      - /data
    networks:
      emqx_bridge:
        aliases:
          - seaweedfs.net
          - warehouse.seaweedfs.net
          # spark-query:1.0.7 uses this virtual-host endpoint.
          - warehouse.minio.net
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:9000/"]
      interval: 3s
      timeout: 5s
      retries: 10
    # ports:
    #   - 9000:9000
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.autoCreateBucket=false
      - -s3.domainName=seaweedfs.net,minio.net
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
