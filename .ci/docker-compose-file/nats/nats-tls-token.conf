port: 4422

ping_interval: 1s
ping_max: 1
max_payload: 1024

tls {
  cert_file: "/etc/nats/certs/cert.pem"
  key_file: "/etc/nats/certs/key.pem"
  ca_file: "/etc/nats/certs/cacert.pem"
}

websocket {
  port: 9322
  tls {
    cert_file: "/etc/nats/certs/cert.pem"
    key_file: "/etc/nats/certs/key.pem"
    ca_file: "/etc/nats/certs/cacert.pem"
  }
}

authorization {
  token: "nats_token"
}
