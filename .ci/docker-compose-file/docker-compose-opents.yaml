services:
  opents_server:
    container_name: opents
    image: petergrace/opentsdb-docker:9aa7f88
    restart: always
    expose:
      - 4242
    networks:
      - emqx_bridge

  opents_tls_lb:
    container_name: opents_tls_lb
    image: public.ecr.aws/nginx/nginx:1.27-bookworm
    restart: always
    expose:
      - 4243
    networks:
      - emqx_bridge
    depends_on:
      opents_server:
        condition: service_started
    volumes:
      - ./opents/tls.conf:/etc/nginx/conf.d/default.conf
      - ./certs/cacert.pem:/opt/certs/ca.crt
      - ./certs/cert.pem:/opt/certs/server.crt
      - ./certs/key.pem:/opt/certs/server.key
